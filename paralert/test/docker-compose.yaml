services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: paralert-test-mailpit
    ports:
      - "31025:1025"   # SMTP
      - "38025:8025"   # HTTP API
    volumes:
      - ./mailpit-auth.txt:/etc/mailpit-auth.txt:ro
    command: >
      --smtp-auth-file /etc/mailpit-auth.txt
      --smtp-auth-allow-insecure
